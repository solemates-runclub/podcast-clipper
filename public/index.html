<title>Podcast Clipper</title>
<link rel="stylesheet" href="/styles.css" />

<header>
  <h1>Podcast Clipper</h1>
  <nav>
    <a href="/" class="active">Sources</a>
  </nav>
</header>

<main>
  <div class="card">
    <form id="add-form" class="row">
      <input id="url-input" type="url" placeholder="Paste a YouTube or Google Drive video URL..." style="flex:1; min-width:280px;" required />
      <button type="submit">Add source</button>
    </form>
    <div id="add-error" class="dim" style="color: var(--danger); display:none;"></div>
  </div>

  <div id="sources-list"></div>
</main>

<script src="/app.js"></script>
